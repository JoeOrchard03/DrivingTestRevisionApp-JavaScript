<!DOCTYPE html> <!-- Defines the document type and version of HTML being used -->
<html lang="en"> <!-- Defines the language of the document as english -->
<head>
  <meta charset="UTF-8"> <!-- Makes sure normal characters display correctly -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ensures the page is responsive and scales correctly on different devices -->
  <title>Driving Test Theory Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f9f9f9;
    }
    .nav-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }
    .nav-btn {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .nav-btn:hover {
      background-color: #0056b3;
    }
    #quiz-container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .option-label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 15px 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .option-label:hover {
      background-color: #f0f7ff;
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Navigation options bar added here -->
  <div class="nav-container">
    <button class="nav-btn" onclick="loadQuestion('/Quiz/TellMeQuestions/1')">Tell Me Questions</button>
    <button class="nav-btn" onclick="loadQuestion('/Quiz/TellMeQuestions/random')">Random Tell Me</button>
  </div>

  <div id="quiz-container">
    <h2 id="question-text">Select a quiz category above to begin...</h2>
    <div id="options-container"></div>
  </div>

  <script>
    async function loadQuestion(endpoint) {
      try {
        document.getElementById('question-text').innerText = "Loading question...";
        document.getElementById('options-container').innerHTML = "";

        const response = await fetch(endpoint);
        
        // Handle standard text response if endpoint is "random" or doesn't return JSON
        if (!response.headers.get('content-type')?.includes('application/json')) {
          const textData = await response.text();
          document.getElementById('question-text').innerText = textData;
          return;
        }

        const data = await response.json();
        
        // Display the question
        document.getElementById('question-text').innerText = data.question;
        
        // Format options into an array for the checkboxes
        const options = [
          { id: "answer", text: data.answer, isCorrect: true },
          { id: "distractor_1", text: data.distractor_1, isCorrect: false },
          { id: "distractor_2", text: data.distractor_2, isCorrect: false }
        ].filter(opt => opt.text); // Filters out any missing distractors

        // Randomise option order
        options.sort(() => Math.random() - 0.5);
        
        // Render the checkboxes
        const container = document.getElementById('options-container');
        container.innerHTML = options.map(option => `
          <label class="option-label">
            <input type="checkbox" value="${option.id}" data-correct="${option.isCorrect}">
            <span>${option.text}</span>
          </label>
        `).join('');
        
      } catch (error) {
        document.getElementById('question-text').innerText = "Failed to load question.";
        console.error("Error fetching quiz data:", error);
      }
    }
  </script>
</body>
</html>

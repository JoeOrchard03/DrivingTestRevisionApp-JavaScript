<!DOCTYPE html> <!-- Sets the type of document -->
<html> 

<head>
     <meta charset="UTF-8">
    <title>Driving Test Quiz</title>
    <link rel="stylesheet" href="./Quiz.css"> <!-- Loads the Quiz.css stylesheet when the page is loaded -->
    <script src="./Quiz.js" defer></script> <!-- Loads the Quiz.js script when the page is loaded -->
    <script src="./ShowMeQuiz.js" defer></script> <!-- Loads the ShowMeQuiz.js script when the page is loaded -->
</head>

<body>

    <button id="homeButton"> <!-- Button to go back to home page -->
        Home
    </button>

    <h1>Show Me Quiz</h1> 
    <p id="score">Score: 0</p> <!-- Paragraph where score is displayed -->

    <p id="question">Loading question... </p> <!-- Paragraph where question is displayed -->

    <!-- Answer images -->
    <div id = "imageAnswers">
        <img id="image1"
             class="show-me-answer"
             src=""
             alt="Answer option 1">

        <img id="image2"
             class="show-me-answer"
             src=""
             alt="Answer option 2">
    </div>

    <p id="feedback"></p>

    <button id="nextQuestion"> <!-- Load Next Question -->
        Next Question
    </button>

</body>

</html>

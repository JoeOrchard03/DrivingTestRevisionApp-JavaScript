<!DOCTYPE html> <!-- Sets the type of document -->
<html> 

<head>
     <meta charset="UTF-8">
    <title>Driving Test Quiz</title>
    <script src="./Quiz.js" defer></script> <!-- Loads the quiz.js script when the page is loaded -->
</head>

<body>

    <h1>Tell Me Quiz</h1> 
    <p id="question">Loading question... </p> <!-- Paragraph where question is displayed -->

    <button id="homeButton"> <!-- Button to go back to home page -->
        Home
    </button>

    <p id="score">Score: 0</p> <!-- Paragraph where score is displayed -->

    <!-- Radio buttons for multiple choice answers -->
    <div>
        <input type="radio" name="answer" id="answer1" value="0"> 
        <label for="answer1" id="label1"></label>
    </div>

    <div>
        <input type="radio" name="answer" id="answer2" value="1">
        <label for="answer2" id="label2"></label>
    </div>

    <div>
        <input type="radio" name="answer" id="answer3" value="2">
        <label for="answer3" id="label3"></label>
    </div>

    <button id="submitAnswer">Submit</button>

    <p id="feedback"></p>

    <button id="nextQuestion"> <!-- Load Next Question -->
        Next Question
    </button>

</body>

</html>
